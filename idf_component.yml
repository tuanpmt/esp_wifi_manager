version: "2.0.0"
description: WiFi Manager component with multi-network support, auto-reconnect, SoftAP captive portal, and REST API configuration
url: https://github.com/tuanpmt/esp_wifi_manager
repository: https://github.com/tuanpmt/esp_wifi_manager.git
documentation: https://github.com/tuanpmt/esp_wifi_manager#readme
issues: https://github.com/tuanpmt/esp_wifi_manager/issues
license: MIT

files:
  # The component manager excludes "**/dist/**" by default, but the embedded
  # Web UI is built into frontend/dist (#3)
  include:
    - "frontend/dist/index.html"
    - "frontend/dist/assets/app.js.gz"
    - "frontend/dist/assets/index.css.gz"
  exclude:
    - "frontend/node_modules/**/*"
    - "**/venv/**/*"
    - "**/__pycache__/**/*"
    - "test/host/test_sm"
    - "test/host/*.dSYM/**/*"
    - "docs/dev/**/*"
    - "CLAUDE.md"

maintainers:
  - tuanpmt

targets:
  - esp32
  - esp32s2
  - esp32s3
  - esp32c3
  - esp32c6
  - esp32h2

dependencies:
  idf:
    version: ">=5.0.0"
  tuanpmt/esp_bus: "^1.0.3"
  espressif/mdns: "^1.2"